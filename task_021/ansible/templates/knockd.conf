[options]
    UseSyslog
    Interface = eth1

[openSSH]
    sequence      = 7000,8000,9000
    seq_timeout   = 10
    tcpflags      = syn
    command       = /sbin/iptables -I INPUT 1 -s %IP% -p tcp --dport 22 -j ACCEPT
    cmd_timeout   = 30
    stop_command  = /sbin/iptables -D INPUT -s %IP% -p tcp --dport 22 -j ACCEPT
