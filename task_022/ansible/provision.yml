- name: OSPF
  hosts: all
  become: true
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Disable ufw service
      ansible.builtin.systemd:
        name: ufw
        state: stopped
        enabled: false

    - name: Add gpg frrouting.org
      ansible.builtin.apt_key:
        url: "https://deb.frrouting.org/frr/keys.asc"
        state: present

    - name: Add frr repo
      ansible.builtin.apt_repository:
        repo: 'deb https://deb.frrouting.org/frr {{ ansible_distribution_release }} frr-stable'
        state: present
  
    - name: Install all packages (including FRR)
      ansible.builtin.package:
        name:
          - vim
          - traceroute
          - tcpdump
          - net-tools 
          - frr
          - frr-pythontools
        state: present
        update_cache: true

    - name: Set up forward packages across routers
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.forwarding
        value: '1'
        state: present
  
    - name: Enable OSPF daemon
      ansible.builtin.lineinfile:
        path: /etc/frr/daemons
        regexp: '^ospfd=.*$'
        line: 'ospfd=yes'
      tags:
        - setup_ospf

    - name: Disable reverse path filtering
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: '0'
        state: present
        sysctl_set: true
        reload: true
      loop:
        - net.ipv4.conf.all.rp_filter
        - net.ipv4.conf.default.rp_filter
        - net.ipv4.conf.eth1.rp_filter
        - net.ipv4.conf.eth2.rp_filter
        - net.ipv4.conf.eth3.rp_filter
      tags:
        - setup_ospf

    - name: Set up OSPF 
      ansible.builtin.template:
        src: frr.conf.j2
        dest: /etc/frr/frr.conf
        owner: frr
        group: frr
        mode: '0640'
      tags:
        - setup_ospf

    - name: Restart FRR
      ansible.builtin.service:
        name: frr
        state: restarted
        enabled: true
      tags:
        - setup_ospf
