---
- name: Install base tools
  ansible.builtin.package:
    name:
      - acl
      - python3-pexpect
      - python3-psycopg2
      - bash-completion
      - wget
    state: present
    update_cache: true

- name: Install barman and postgresql packages on barman
  ansible.builtin.package:
    name:
      - barman
      - barman-cli
      - postgresql
    state: present
    update_cache: true
  when: (ansible_hostname == "barman")

- name: Install barman-cli and postgresql packages on nodes
  ansible.builtin.package:
    name:
      - barman-cli
    state: present
    update_cache: true
  when: (ansible_hostname != "barman")


- name: Generate SSH key for postgres
  ansible.builtin.user:
    name: postgres
    generate_ssh_key: true
    ssh_key_type: rsa
    ssh_key_bits: 4096
    force: false
  when: (ansible_hostname == "node1")

- name: Generate SSH key for barman
  ansible.builtin.user:
    name: barman
    uid: 994
    shell: /bin/bash
    generate_ssh_key: true
    ssh_key_type: rsa
    ssh_key_bits: 4096
    force: false
  when: (ansible_hostname == "barman")

- name: Fetch all public ssh keys node1
  ansible.builtin.shell: cat /var/lib/postgresql/.ssh/id_rsa.pub
  register: ssh_keys
  when: (ansible_hostname == "node1")

- name: Transfer public key to barman
  delegate_to: barman
  authorized_key:
    key: "{{ ssh_keys.stdout }}"
    comment: "{{ ansible_hostname }}"
    user: barman
  when: (ansible_hostname == "node1")

- name: Fetch all public ssh keys barman
  ansible.builtin.shell: cat /var/lib/barman/.ssh/id_rsa.pub
  register: ssh_keys
  when: (ansible_hostname == "barman")

- name: Transfer public key to barman
  delegate_to: node1
  authorized_key:
    key: "{{ ssh_keys.stdout }}"
    comment: "{{ ansible_hostname }}"
    user: postgres
  when: (ansible_hostname == "barman")

- name: Create barman user
  become_user: postgres
  postgresql_user:
    name: '{{ install_barman_user }}'
    password: '{{ install_barman_user_password }}'
    role_attr_flags: SUPERUSER
  when: (ansible_hostname == "node1")

- name: Add permission for barman
  ansible.builtin.lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    line: 'host    all   {{ install_barman_user }}    {{ install_barman_ip }}/32    scram-sha-256'
  when: (ansible_hostname == "node1") or (ansible_hostname == "node2")

- name: Add permission for barman
  ansible.builtin.lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    line: 'host    replication   {{ install_barman_user }}    {{ install_barman_ip }}/32    scram-sha-256'
  when: (ansible_hostname == "node1") or (ansible_hostname == "node2")

- name: Restart postgresql-server on node1
  ansible.builtin.service:
    name: postgresql@14-main
    state: restarted
  when: (ansible_hostname == "node1")

- name: Create DB for backup
  become_user: postgres
  postgresql_db:
    name: otus
    encoding: UTF-8
    template: template0
    state: present
  when: (ansible_hostname == "node1")

- name: Add tables to otus_backup
  become_user: postgres
  postgresql_table:
    db: otus
    name: test1
    state: present
  when: (ansible_hostname == "node1")

- name: Copy .pgpass
  ansible.builtin.template:
    src: .pgpass.j2
    dest: /var/lib/barman/.pgpass
    owner: '{{ install_barman_user }}'
    group: '{{ install_barman_user }}'
    mode: '0600'
  when: (ansible_hostname == "barman")

- name: Copy barman.conf
  ansible.builtin.template:
    src: barman.conf.j2
    dest: /etc/barman.conf
    owner: '{{ install_barman_user }}'
    group: '{{ install_barman_user }}'
    mode: '0755'
  when: (ansible_hostname == "barman")

- name: Copy node1.conf
  ansible.builtin.template:
    src: node1.conf.j2
    dest: /etc/barman.d/node1.conf
    owner: '{{ install_barman_user }}'
    group: '{{ install_barman_user }}'
    mode: '0755'
  when: (ansible_hostname == "barman")

- name: Barman switch-wal node1
  become_user: '{{ install_barman_user }}'
  ansible.builtin.shell: barman switch-wal node1
  when: (ansible_hostname == "barman")

- name: Barman cron
  become_user: '{{ install_barman_user }}'
  ansible.builtin.shell: barman cron
  when: (ansible_hostname == "barman")
