---
- name: Default all
  hosts: all
  become: true
  tasks:
    - name: Install packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
        update_cache: true
      loop:
        - bind
        - bind-utils

    - name: Copy transferkey to all servers and the client
      ansible.builtin.copy:
        src: named.zonetransfer.key
        dest: /etc/named.zonetransfer.key
        owner: root
        group: named
        mode: 0644

    - name: Start chronyd
      ansible.builtin.service:
        name: chronyd
        state: restarted
        enabled: true


- name: Set up ns01
  hosts: ns01
  become: true
  tasks:
    - name: Copy named.conf
      ansible.builtin.copy:
        src: master-named.conf
        dest: /etc/named.conf
        owner: root
        group: named
        mode: 0640

    - name: Copy zones
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/named/
        owner: root
        group: named
        mode: 0660
      with_fileglob:
        - named.d*
        - named.newdns.lab

    - name: Copy resolv.conf to the servers
      ansible.builtin.template:
        src: servers-resolv.conf.j2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: 0644

    - name: Set /etc/named permissions
      ansible.builtin.file:
        path: /etc/named
        owner: root
        group: named
        mode: 0670

    - name: Ensure named is running and enabled
      ansible.builtin.service:
        name: named
        state: restarted
        enabled: true

- name: Set up ns02
  hosts: ns02
  become: true
  tasks:
    - name: Copy named.conf
      ansible.builtin.copy:
        src: slave-named.conf
        dest: /etc/named.conf
        owner: root
        group: named
        mode: 0640

    - name: Copy resolv.conf to the servers
      ansible.builtin.template:
        src: servers-resolv.conf.j2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: 0644

    - name: Set /etc/named permissions
      ansible.builtin.file:
        path: /etc/named
        owner: root
        group: named
        mode: 0670

    - name: Ensure named is running and enabled
      ansible.builtin.service:
        name: named
        state: restarted
        enabled: true

- name: Set up clients
  hosts: client1, client2
  become: true
  tasks:
    - name: Copy resolv.conf to the client
      ansible.builtin.copy:
        src: client-resolv.conf
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: 0644

    - name: Copy rndc conf file
      ansible.builtin.copy:
        src: rndc.conf
        dest: /home/vagrant/rndc.conf
        owner: vagrant
        group: vagrant
        mode: 0644

    - name: Copy motd to the client
      ansible.builtin.copy:
        src: client-motd
        dest: /etc/motd
        owner: root
        group: root
        mode: 0644
