- name: Set up FreeIPA server
  hosts: server
  become: true
  tasks:
    - name: Set up timezone
      ansible.builtin.timezone:
        name: "Europe/Moscow"

    - name: Install packages
      ansible.builtin.package:
        name:
          - chrony
          - ipa-server
        state: present
        update_cache: true

    - name: Start chronyd 
      ansible.builtin.service:
        name: chronyd
        state: restarted
        enabled: true

    - name: Add FreeIPA server records to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED FREEIPA HOSTS"
        block: |
          {{ ipa_server_ip }} {{ ipa_server_hostname }} ipa

    - name: Configure FreeIPA server
      ansible.builtin.command:
        argv:
          - ipa-server-install
          - --unattended
          - "--hostname={{ ipa_server_hostname }}"
          - "--domain={{ ipa_domain }}"
          - "--realm={{ ipa_realm }}"
          - "--ds-password={{ ipa_dm_password }}"
          - "--admin-password={{ ipa_admin_password }}"
          - --no-ntp

- name: Set up clients
  hosts: clients
  become: true
  tasks:
    - name: Set up timezone
      ansible.builtin.timezone:
        name: "Europe/Moscow"

    - name: Install chrony
      ansible.builtin.package:
        name:
          - chrony
          - ipa-client
        state: present
        update_cache: true

    - name: Start chronyd
      ansible.builtin.service:
        name: chronyd
        state: restarted
        enabled: true

    - name: Add FreeIPA server records to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED FREEIPA HOSTS"
        block: |
          {{ ipa_server_ip }} {{ ipa_server_hostname }} ipa

    - name: Enroll client into FreeIPA
      ansible.builtin.command:
        argv:
          - ipa-client-install
          - --unattended
          - --mkhomedir
          - "--domain={{ ipa_domain }}"
          - "--realm={{ ipa_realm }}"
          - "--server={{ ipa_server_hostname }}"
          - --no-ntp
          - "--principal={{ ipa_admin_login }}"
          - "--password={{ ipa_admin_password }}"
      no_log: true
